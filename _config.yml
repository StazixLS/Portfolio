title: "Sev FORNER | Portfolio"
description: "Gameplay / AI / Tools Programmer"
author: "StazixLS"
url: "https://stazixls.github.io"
baseurl: "/portfolio"
avatar: "https://avatars.githubusercontent.com/u/183628841?v=4"

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - SETUP.md
  - preview.html
  - preview-project.html
  - tools
  - _site_preview
