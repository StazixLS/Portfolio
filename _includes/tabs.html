{% assign home = "/" | relative_url %}
<nav class="tabs" aria-label="Navigation">
  <a href="{{ home }}#about" class="tab" data-tab="about"><span class="tab-dot"></span>About.h</a>
  <a href="{{ home }}#projets" class="tab" data-tab="projets"><span class="tab-dot"></span>Projects.cpp</a>
  <a href="{{ home }}#profile" class="tab" data-tab="profile"><span class="tab-dot"></span>Profile.cs</a>
  <a href="{{ home }}#parcours" class="tab" data-tab="parcours"><span class="tab-dot"></span>Background.py</a>
  <a href="{{ home }}#contact" class="tab" data-tab="contact"><span class="tab-dot"></span>Contact.xaml</a>
  {%- if page.layout == "project" %}
  {%- assign tab_slug = page.title_fr | slugify %}
  <span class="tab tab-file active" aria-current="page">
    <span class="tab-dot"></span>
    <span class="tab-name"><span lang="fr">{{ page.title_fr }}.md</span><span lang="en" hidden>{{ page.title_en | default: page.title_fr }}.md</span></span>
    <a class="tab-close" href="{{ home }}#project-{{ tab_slug }}" aria-label="Fermer et revenir aux projets / Close and go back to projects" title="Fermer / Close">×</a>
  </span>
  {%- endif %}
</nav>
