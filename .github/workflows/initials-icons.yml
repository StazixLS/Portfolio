name: Icônes à initiales

# Régénère les icônes à initiales quand un projet est ajouté ou modifié.
on:
  push:
    branches: [main]
    paths: ["_projects/**", "_data/project_types.yml", "tools/make_initials_icons.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pyyaml
      - run: python3 tools/make_initials_icons.py
      - name: Commit si changement
        run: |
          git add -A assets/projects/initials
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Icônes à initiales régénérées"
          git push
